<div class="custom-toolbar">

  <p-button icon="pi pi-bars" [text]="true" severity="info" (onClick)="drawerVisible = !drawerVisible" />

  <span class="drawer-title-main">
    Circular de Seguimiento a los Proyecto Q's
  </span>

</div>
<div class="flex justify-center">
<p-drawer [(visible)]="drawerVisible" position="left" [modal]="true" [style]="{ width: '300px' }" [closable]="false" >
    <div class="drawer-header">
      <span class="drawer-title">
      Circular de Seguimiento
      </span>
      
      <p-button
        icon="pi pi-times"
        [text]="true"
        [rounded]="true"
        severity="danger"
        ariaLabel="Cerrar"
        (onClick)="drawerVisible = false"
      />
    </div>

  <p-menu [model]="items"class="flex justify-center" styleClass="w-full md:w-60 mi-menu-personalizado" >
      <ng-template #start>
                <span class="inline-flex items-center gap-4 px-4.5 py-4.5">
                    Productos
                </span>
                </ng-template>
  </p-menu>

</p-drawer>
</div>

<div class="content">

  <app-circular-content [selectedItem]="selected">
  </app-circular-content>

</div>
