<p-menubar [model]="menuItems" class="fixed-navbar">

    <!-- IZQUIERDA: ICONO HOME -->
    <ng-template #start>

        <div class="navbar-brand">

            <i class="pi pi-home home-icon"></i>

            <a routerLink="/principal" routerLinkActive="router-link-active" class="system-title">

                Sistema de Informacion DGIP

            </a>

        </div>

    </ng-template>


    <!-- DERECHA -->
    <ng-template #end>

        <div class="navbar-actions">

            <!-- LOGO -->
            @if (!isMobile) {

            <img src="/navigation/appbar/SF.jpg" class="appbar-logo" alt="Logo">

            }


            <!-- ADMINISTRACIÓN -->
            @if (canAccessModule('users')) {

            <a routerLink="/admin" routerLinkActive="router-link-active" class="admin-link">

                <i class="pi pi-file-edit"></i>
                <span>Admin</span>

            </a>

            }


            <!-- DARK MODE -->
            <p-button [icon]="isDarkMode ? 'pi pi-sun' : 'pi pi-moon'" [rounded]="true" [text]="true" severity="primary"
                [outlined]="true" (onClick)="toggleDarkMode()" [pTooltip]="isDarkMode ? 'Modo claro' : 'Modo oscuro'"
                tooltipPosition="bottom">
            </p-button>


            <!-- SEPARADOR -->
            <div class="navbar-separator"></div>


            <!-- USUARIO -->
            @if (currentUser) {
            <div class="user-section">
                <!-- AVATAR Y NOMBRE DEL USUARIO -->
                <app-navbar-avatar [showSessionDetails]="showSessionDetailsModal" [logout]="logout"
                    [showUserMenu]="showUserMenu" [showSessionModal]="showSessionModal" [animating]="animating">

                </app-navbar-avatar>
                    <!-- BOTÓN INFORMACIÓN -->
                <!-- <button pButton label="Info" icon="pi pi-info-circle" [rounded]="true" severity="info"
                    (click)="sessionPopover.toggle($event)">
                </button> -->

                

            </div>

            }




        </div>

    </ng-template>

</p-menubar>



<!-- ADVERTENCIA DE SESIÓN -->

@if (showSessionWarning) {

<div class="session-warning-content">

    <div class="row">

        <div class="session-text">

            <p>

                <strong>⚠️ ¡Atención!</strong>

                Tu sesión expirará en

                {{ formatTimeLeft(sessionInfo?.timeLeft || 0) }}.

                <button (click)="extendSession(); showSessionWarning = false">

                    ⏳ Extender sesión

                </button>


                <button (click)="showSessionWarning = false">

                    ❌

                </button>

            </p>

        </div>

    </div>

</div>

}


<router-outlet></router-outlet>
