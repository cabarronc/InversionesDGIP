<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8 fondo">
  <div class="max-w-md w-full space-y-8">

    <div class="mx-auto h-12 w-12 flex items-center justify-center rounded-full">
      <img
        src="https://github.com/cabarronc/RecursosMultimedia/blob/main/LOGO_FINANZAS_HORIZONTAL_FONDO%20AZUL.png?raw=True"
        width="70%" height="90%">
    </div>
    <div class="container">
      <div class="row mt-1">
        <div class="col-12 col-sm-8 col-md-6 col-lg-4">
          <h2 class="mt-2  space-y-12 font-extrabold text-gray-900">
            Iniciar Sesión
          </h2>
          <p class="mt-2 text-sm space-y-12  text-gray-800">
            Accede a tu cuenta para continuar
          </p>
          <form class="mt-4 space-y-6" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <div>
              <label for="email">Correo electrónico</label>
              <input pInputText id="email" type="email" formControlName="email" placeholder="Correo electrónico" fluid pSize="small" />
              <p-message *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
                severity="error" variant="simple" size="small">
                El email es requerido y debe ser válido
              </p-message>
            </div>

            <div>
              <label for="password">Contraseña</label>

              <p-iconfield>
                <input pInputText id="password" [type]="passInputType" formControlName="password"
                  placeholder="Ingresa tu contraseña" fluid pSize="small"/>
                <p-inputicon [styleClass]="eyeIcon" style="cursor: pointer;" (click)="togglePassVisibility()" />
              </p-iconfield>

              <p-message *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
                severity="error" variant="simple" size="small">
                La contraseña es requerida
              </p-message>
            </div>


            <div class="flex items-center justify-between my-3">
              <label for="recuerdame" style="font-weight: bold;">Recuerdame
                <span style="margin-left: 0.2rem;">
                  <i class="pi pi-question-circle"
                    pTooltip="Duración de sesión:&#10;Normal: 8 horas  &#10;Con Recordarme: 30 días"
                    tooltipStyleClass="whitespace-pre-line"></i>
                </span>&nbsp;
              </label>
              <p-checkbox inputId="recuerdame" formControlName="rememberMe" [binary]="true" label="Recordarme"
                #recuerdame></p-checkbox>&nbsp;


              <p-button type="button" severity="warn" label="¿Olvidaste tu contraseña?"
                (onClick)="showForgotPassword = true"  size="small"/>
            </div>

            <p-message *ngIf="errorMessage" severity="error" class="mb-3">
              {{ errorMessage }}
            </p-message>


            <p-button type="submit" [disabled]="loginForm.invalid || loading" [loading]="loading"
              [label]="loading ? 'Iniciando sesión...' : 'Iniciar Sesión'"  styleClass="w-full" size="small" />
          </form>
        </div>
      </div>
    </div>

    <p-dialog *ngIf="showForgotPassword" header="Recuperar Contraseña" [visible]="true" [modal]="true"
      (onHide)="showForgotPassword = false" [style]="{ minWidth: '400px', width: '450px' }">

      <form [formGroup]="forgotPasswordForm" (ngSubmit)="onForgotPassword()" class="space-y-4">
        <div>
          <label for="forgotEmail">Email</label>
          <input pInputText id="forgotEmail" type="email" formControlName="email" placeholder="tu@email.com" fluid />
          <p-message *ngIf="forgotPasswordForm.get('email')?.invalid && forgotPasswordForm.get('email')?.touched"
            severity="error" variant="simple" size="small">
            El email es requerido y debe ser válido
          </p-message>
        </div>

        <div class="flex justify-end space-x-3 mt-4">
          <p-button type="button" label="Cancelar" severity="secondary" (onClick)="showForgotPassword = false" />
          <p-button type="submit" [disabled]="forgotPasswordForm.invalid || loadingReset" [loading]="loadingReset"
            [label]="loadingReset ? 'Enviando...' : 'Enviar'" />
        </div>

      </form>
    </p-dialog>
  </div>
</div>
